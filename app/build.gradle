plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 可选：在根目录放 keystore.properties 即可用正式签名，否则回落 debug 签名
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    compileSdkVersion 33
    buildToolsVersion '33.0.0'

    buildFeatures {
    }
    kotlinOptions {
        jvmTarget = '17'
        // release 变体下 Compose 依赖的 Kotlin 元数据版本检查会误报，跳过
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    defaultConfig {
        applicationId 'io.github.kalpa0448.taskmgr'
        minSdkVersion 24
        targetSdkVersion 33
        // 版本号规则：versionCode = major*10000 + minor*100 + patch
        // 1.0.0 -> 10000，1.1.0 -> 10100，1.1.1 -> 10101
        versionCode 10300
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    // 无第三方依赖：UI 全部用系统控件 + 自绘
}


// 确保 release/debug 两个变体都跳过 Kotlin 元数据版本检查
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }
}
